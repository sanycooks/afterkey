[package]
name = "afterkey-will"
version = "0.1.0"
edition = "2021"
description = "Afterkey will contract: a seedless multichain wallet with a dead man's switch and anti-coercion rules"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
borsh = "1.8.1"
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

