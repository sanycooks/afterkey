[package]
name = "afterkey-factory"
version = "0.1.0"
edition = "2021"
description = "Creates Afterkey wills on accounts with no access keys, running code pinned by hash"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
borsh = "1.8.1"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
